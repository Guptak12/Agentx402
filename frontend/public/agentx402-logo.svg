<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ECDC4;stop-opacity:1" />
      <stop offset="30%" style="stop-color:#44A08D;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ringGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10E5A5;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="90" fill="url(#logoGradient)" opacity="0.1"/>
  
  <!-- Letter A - properly positioned -->
  <path d="M70 150 L100 60 L130 150 M80 120 L120 120" 
        stroke="url(#logoGradient)" 
        stroke-width="8" 
        fill="none" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Orbital ring -->
  <ellipse cx="100" cy="100" rx="70" ry="30" 
           stroke="url(#ringGradient)" 
           stroke-width="4" 
           fill="none"
           transform="rotate(-15 100 100)"/>
  
  <!-- Small orbital dot -->
  <circle cx="150" cy="90" r="5" fill="url(#ringGradient)">
    <animateTransform attributeName="transform"
                      attributeType="XML"
                      type="rotate"
                      from="0 100 100"
                      to="360 100 100"
                      dur="6s"
                      repeatCount="indefinite"/>
  </circle>
</svg>
